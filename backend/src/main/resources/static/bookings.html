<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings | Grand Stay Hotel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="inner">
        <a class="brand" href="index.html"><span class="logo">GS</span> Grand Stay Hotel</a>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="book.html">New Booking</a>
            <a href="bookings.html">Bookings</a>
            <a href="rooms.html">Rooms</a>
            <a href="customers.html">Customers</a>
        </div>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <div>
            <h1>Bookings</h1>
            <p>Check guests in and out, change or cancel bookings.</p>
        </div>
        <a class="btn btn-gold" href="book.html">+ New Booking</a>
    </div>

    <section class="card">
        <div class="toolbar">
            <input type="search" id="search" placeholder="Search guest, email or room…">
            <select id="status-filter">
                <option value="">All statuses</option>
                <option value="BOOKED">Booked</option>
                <option value="CHECKED_IN">Checked in</option>
                <option value="CHECKED_OUT">Checked out</option>
                <option value="CANCELLED">Cancelled</option>
            </select>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>#</th><th>Guest</th><th>Room</th><th>Stay</th><th>Guests</th><th>Total</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="bookings-body"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
            </table>
        </div>
    </section>
</main>

<div class="modal-backdrop" id="edit-modal">
    <div class="modal">
        <h3 id="edit-title">Edit booking</h3>
        <form id="edit-form" novalidate>
            <input type="hidden" name="id">
            <div class="form-grid">
                <div class="field">
                    <label for="checkInDate">Check-in <span class="req">*</span></label>
                    <input type="date" id="checkInDate" name="checkInDate" required>
                    <div class="error-text"></div>
                </div>
                <div class="field">
                    <label for="checkOutDate">Check-out <span class="req">*</span></label>
                    <input type="date" id="checkOutDate" name="checkOutDate" required>
                    <div class="error-text"></div>
                </div>
                <div class="field">
                    <label for="numberOfGuests">Guests <span class="req">*</span></label>
                    <input type="number" id="numberOfGuests" name="numberOfGuests" min="1" max="10" required>
                    <div class="error-text"></div>
                </div>
                <div class="field">
                    <label for="roomId">Room</label>
                    <select id="roomId" name="roomId"></select>
                    <div class="error-text"></div>
                </div>
                <div class="field full">
                    <label for="specialRequests">Special requests</label>
                    <textarea id="specialRequests" name="specialRequests" maxlength="500"></textarea>
                    <div class="error-text"></div>
                </div>
            </div>
            <p class="hint">The total is recalculated from the room price and the number of nights.</p>
            <div class="form-actions">
                <button type="button" class="btn btn-outline" data-close="edit-modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/bookings.js"></script>
</body>
</html>
