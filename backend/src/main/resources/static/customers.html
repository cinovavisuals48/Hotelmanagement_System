<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | Grand Stay Hotel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="inner">
        <a class="brand" href="index.html"><span class="logo">GS</span> Grand Stay Hotel</a>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="book.html">New Booking</a>
            <a href="bookings.html">Bookings</a>
            <a href="rooms.html">Rooms</a>
            <a href="customers.html">Customers</a>
        </div>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <div>
            <h1>Customers</h1>
            <p>Guests are saved automatically when they book. You can also add or edit them here.</p>
        </div>
        <button class="btn btn-gold" id="add-btn">+ Add Customer</button>
    </div>

    <section class="card">
        <div class="toolbar">
            <input type="search" id="search" placeholder="Search name, email or phone…">
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>#</th><th>Name</th><th>Contact</th><th>ID proof</th><th>Registered</th><th>Actions</th></tr>
                </thead>
                <tbody id="customers-body"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
            </table>
        </div>
    </section>
</main>

<div class="modal-backdrop" id="customer-modal">
    <div class="modal">
        <h3 id="customer-modal-title">Add Customer</h3>
        <form id="customer-form" novalidate>
            <input type="hidden" name="id">
            <div class="form-grid">
                <div class="field">
                    <label for="firstName">First name <span class="req">*</span></label>
                    <input id="firstName" name="firstName" required maxlength="50">
                    <div class="error-text"></div>
                </div>
                <div class="field">
                    <label for="lastName">Last name <span class="req">*</span></label>
                    <input id="lastName" name="lastName" required maxlength="50">
                    <div class="error-text"></div>
                </div>
                <div class="field">
                    <label for="email">Email <span class="req">*</span></label>
                    <input type="email" id="email" name="email" required maxlength="100">
                    <div class="error-text"></div>
                </div>
                <div class="field">
                    <label for="phone">Phone <span class="req">*</span></label>
                    <input type="tel" id="phone" name="phone" required maxlength="20">
                    <div class="error-text"></div>
                </div>
                <div class="field">
                    <label for="idProofType">ID proof type</label>
                    <select id="idProofType" name="idProofType">
                        <option value="">Select…</option>
                        <option>Aadhaar</option>
                        <option>Passport</option>
                        <option>Driving Licence</option>
                        <option>Voter ID</option>
                        <option>PAN Card</option>
                    </select>
                    <div class="error-text"></div>
                </div>
                <div class="field">
                    <label for="idProofNumber">ID proof number</label>
                    <input id="idProofNumber" name="idProofNumber" maxlength="50">
                    <div class="error-text"></div>
                </div>
                <div class="field full">
                    <label for="address">Address</label>
                    <input id="address" name="address" maxlength="255">
                    <div class="error-text"></div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-outline" data-close="customer-modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save customer</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-backdrop" id="history-modal">
    <div class="modal" style="max-width: 820px">
        <h3 id="history-title">Booking history</h3>
        <div class="table-wrap">
            <table>
                <thead><tr><th>#</th><th>Room</th><th>Stay</th><th>Total</th><th>Status</th></tr></thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-outline" data-close="history-modal">Close</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
