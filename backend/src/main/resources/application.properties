spring.application.name=hotel-management-system
server.port=8080

# ---------------------------------------------------------------
# MySQL connection
# Create the schema with database/schema.sql in MySQL Workbench,
# or let createDatabaseIfNotExist create an empty "hotel_db" for you.
# Override the credentials with the DB_URL / DB_USERNAME / DB_PASSWORD
# environment variables, or edit the defaults below.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# "update" keeps the tables in sync with the entities without dropping data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Seed sample rooms on first start when the rooms table is empty
hotel.seed-sample-rooms=true

# JSON dates as yyyy-MM-dd instead of arrays
spring.jackson.serialization.write-dates-as-timestamps=false
